name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Ekstrak ZIP proyek (jika diunggah berupa ZIP)
        run: |
          if ls ./*.zip >/dev/null 2>&1; then
            rm -rf proyek
            mkdir proyek
            for z in ./*.zip; do unzip -q -o "$z" -d proyek; done
          fi
          S=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$S" ]; then echo "settings.gradle tidak ditemukan"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: BriefingShift-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Buat Release agar mudah diunduh dari Chrome
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Briefing Shift build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan folder project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Memakai $ZIP"
            mkdir -p _proj
            unzip -q -o "$ZIP" -d _proj
            DIR=$(dirname "$(find _proj -name settings.gradle.kts | head -1)")
            echo "PROJ=$DIR" >> "$GITHUB_ENV"
          else
            echo "PROJ=." >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Ambil APK
        run: cp "${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk" BriefingShift.apk

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: BriefingShift-apk
          path: BriefingShift.apk

      - name: Terbitkan ke Releases (download langsung dari Chrome)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Briefing Shift build ${{ github.run_number }}
          files: BriefingShift.apk
